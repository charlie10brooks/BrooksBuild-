name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          set -o pipefail
          docker build --progress=plain -t terrascope:ci . 2>&1 | tee build.log || {
            echo "::error title=docker build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: Run the backend tests inside the image
        run: |
          set -o pipefail
          docker run --rm terrascope:ci python -m unittest discover -s tests -t . 2>&1 | tee test.log || {
            echo "::error title=tests failed::$(tail -n 40 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: Start the app and check that it answers
        run: |
          mkdir -p "$PWD/ci-data"
          docker run -d --name ts -p 8000:8000 \
            -e TERRASCOPE_DATA_DIR=/data -e TERRASCOPE_DEV_MODE=1 -e TERRASCOPE_MIN_FREE_BYTES=0 \
            -v "$PWD/ci-data:/data" terrascope:ci
          for i in $(seq 1 40); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          if ! curl -sf http://localhost:8000/api/health || ! curl -sf -o /dev/null http://localhost:8000/; then
            echo "::error title=app did not answer::$(docker logs ts 2>&1 | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; fi
          echo "app answers"; docker logs ts

      - name: Publish the image (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')/terrascope
          docker tag terrascope:ci "$IMG:latest"
          docker push "$IMG:latest"
